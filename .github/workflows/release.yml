name: 'Release & Packages'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.0-build.${{ github.run_number }}
          releaseName: 'Usage View v0.1.0 (Build ${{ github.run_number }})'
          releaseBody: |
            ### ⚡ Usage View Automated Release
            
            Multi-platform native desktop tray resident for monitoring **Claude** and **Antigravity / Gemini** quotas in real-time.

            #### 📦 Downloads & Installers:
            - **Windows**: `.msi` (Installer) & `.exe` (NSIS Setup / Portable)
            - **macOS**: `.dmg` (Universal / Apple Silicon & Intel)
            - **Linux**: `.AppImage` & `.deb`

            #### 🚀 Highlights:
            - ✨ Clean 1-tone dark interface anchored to tray coordinates.
            - ⏱️ Live countdown timers for 5-Hour rolling limits.
            - 🔔 Throttled single-event 100% capacity reset toasts (app-branded).
            - 🔒 Zero-plaintext OS Keyring credential encryption.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
